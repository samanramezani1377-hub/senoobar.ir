name: Senoobar Theme CI

on:
  push:
    branches: [main, branch-agent-mcp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate PHP 8.3 and build installable theme ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run WebMCP automated tests
        run: node --test tests/webmcp/*.test.cjs

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip
          coverage: none

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' \
            -not -path './.git/*' \
            -not -path './vendor/*')
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate theme structure
        shell: bash
        run: |
          set -euo pipefail
          test -f style.css
          test -f functions.php
          test -f index.php
          test -f header.php
          test -f footer.php
          grep -q '^Theme Name: Senoobar' style.css
          grep -q '^Version:' style.css
          grep -q '^Requires PHP: 8.0' style.css

      - name: Build installable theme ZIP
        shell: bash
        run: |
          set -euo pipefail
          # Keep the installed theme directory slug so WordPress replaces the
          # existing senoobar.ir-main theme instead of installing a second theme.
          theme_dir="senoobar.ir-main"
          rm -rf "$theme_dir" dist
          mkdir -p "$theme_dir" dist

          rsync -a --exclude='.git/' --exclude='.github/' --exclude='dist/' --exclude="$theme_dir/" ./ "$theme_dir/"

          test -f "$theme_dir/style.css"
          test -f "$theme_dir/functions.php"

          version="$(awk -F': ' '/^Version:/{print $2; exit}' "$theme_dir/style.css" | tr -d '\r')"
          test -n "$version"

          zip -qr "dist/Senoobar-theme-v${version}.zip" "$theme_dir"
          test -f "dist/Senoobar-theme-v${version}.zip"
          unzip -t "dist/Senoobar-theme-v${version}.zip"

          unzip -l "dist/Senoobar-theme-v${version}.zip" | grep -q 'senoobar.ir-main/style.css'
          unzip -l "dist/Senoobar-theme-v${version}.zip" | grep -q 'senoobar.ir-main/functions.php'

      - name: Upload installable theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: senoobar-theme-installable
          path: dist/Senoobar-theme-*.zip
          if-no-files-found: error
          retention-days: 30
