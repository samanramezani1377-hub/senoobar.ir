*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif}button,input{font:inherit}

@media(max-width:700px){.sub{display:none}.search{width:42vw}.panel{top:auto;bottom:10px;right:10px;max-height:46%}.hint{display:none}.legend{max-width:90vw}.title{font-size:12px}}

const svg=document.getElementById('svg'),world=document.getElementById('world'),panel=document.getElementById('panel'),stats=document.getElementById('stats'),legend=document.getElementById('legend'),search=document.getElementById('search');
const W=1600,H=1000; let showLabels=true, selected=null, scale=1, ox=0, oy=0, dragging=false, sx=0, sy=0;
// Deterministic radial layout by type; readable without any external library.
const groups={core:[800,470],php:[420,430],template:[1120,300],part:[1120,650],woo:[800,820],css:[280,770],js:[380,720],pwa:[1380,760],data:[1380,350]};
const counts={};N.forEach(n=>counts[n.type]=(counts[n.type]||0)+1);const idx={};N.forEach(n=>{idx[n.type]=(idx[n.type]||0);const g=groups[n.type]||[800,500],i=idx[n.type]++,c=counts[n.type],r=Math.min(270,55+c*9),a=(i/c)*Math.PI*2-(Math.PI/2);n.x=g[0]+Math.cos(a)*r;n.y=g[1]+Math.sin(a)*r;n.r=n.type==='core'?18:n.type==='php'?10:8});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(){world.innerHTML='';const eg=document.createElementNS('http://www.w3.org/2000/svg','g');const ng=document.createElementNS('http://www.w3.org/2000/svg','g');world.append(eg,ng);
 E.forEach(e=>{const a=N.find(n=>n.id===e.a),b=N.find(n=>n.id===e.b);if(!a||!b)return;const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.classList.add('edge');l.dataset.a=e.a;l.dataset.b=e.b;l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);eg.appendChild(l)});
 N.forEach(n=>{const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('node');g.dataset.id=n.id;g.setAttribute('transform',`translate(${n.x},${n.y})`);const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',n.r);c.setAttribute('fill',C[n.type]||'#aaa');g.appendChild(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.classList.add('node-label');t.textContent=n.label;t.setAttribute('y',n.r+14);if(!showLabels)t.style.display='none';g.appendChild(t);g.addEventListener('click',()=>select(n.id));ng.appendChild(g)});
 stats.innerHTML=`گره‌ها: <b>${N.length}</b> · ارتباط‌ها: <b>${E.length}</b> · گروه‌ها: <b>${Object.keys(counts).length}</b>`;legend.innerHTML='';Object.entries(labels).forEach(([k,v])=>{const b=document.createElement('button');b.innerHTML=`<span class="dot" style="background:${C[k]}"></span>${v}`;b.onclick=()=>filterType(k);legend.appendChild(b)});applyTransform()}
function applyTransform(){world.setAttribute('transform',`translate(${ox},${oy}) scale(${scale})`)}
function select(id){selected=id;document.querySelectorAll('.node').forEach(g=>g.classList.remove('selected','near','dim'));document.querySelectorAll('.edge').forEach(l=>l.classList.remove('active','dim'));const n=N.find(x=>x.id===id);const near=new Set([id]);E.forEach(e=>{if(e.a===id)near.add(e.b);if(e.b===id)near.add(e.a)});document.querySelectorAll('.node').forEach(g=>{if(g.dataset.id===id)g.classList.add('selected');else if(near.has(g.dataset.id))g.classList.add('near');else g.classList.add('dim')});document.querySelectorAll('.edge').forEach(l=>{if(l.dataset.a===id||l.dataset.b===id)l.classList.add('active');else l.classList.add('dim')});panel.hidden=false;panel.innerHTML=`<button class="close" onclick="closePanel()">×</button><h2>${esc(n.label)}</h2><div class="badges"><span class="badge">${esc(labels[n.type]||n.type)}</span></div><div class="path">${esc(n.id)}</div><p>${esc(n.desc||'گرهٔ معماری پروژه.')}</p><p><b>ارتباط مستقیم:</b> ${[...near].filter(x=>x!==id).map(x=>esc(N.find(n=>n.id===x)?.label||x)).join(' · ')||'ندارد'}</p>`}
function closePanel(){panel.hidden=true;selected=null;document.querySelectorAll('.node,.edge').forEach(x=>x.classList.remove('selected','near','dim','active'))}
function filterType(type){closePanel();document.querySelectorAll('.node').forEach(g=>g.classList.toggle('dim',N.find(n=>n.id===g.dataset.id)?.type!==type));document.querySelectorAll('.edge').forEach(l=>l.classList.add('dim'))}
search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();document.querySelectorAll('.node').forEach(g=>{const n=N.find(n=>n.id===g.dataset.id);g.classList.toggle('dim',!!q&&!(`${n.id} ${n.label} ${n.desc}`.toLowerCase().includes(q)))});document.querySelectorAll('.edge').forEach(l=>l.classList.toggle('dim',!!q))});
document.getElementById('labels').onclick=()=>{showLabels=!showLabels;document.querySelectorAll('.node-label').forEach(t=>t.style.display=showLabels?'':'none')};document.getElementById('reset').onclick=()=>{scale=1;ox=0;oy=0;search.value='';closePanel();document.querySelectorAll('.node,.edge').forEach(x=>x.classList.remove('dim'));applyTransform()};
svg.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY<0?1.1:.9;scale=Math.max(.35,Math.min(3,scale*d));applyTransform()},{passive:false});svg.addEventListener('pointerdown',e=>{dragging=true;sx=e.clientX;sy=e.clientY;svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!dragging)return;ox+=(e.clientX-sx);oy+=(e.clientY-sy);sx=e.clientX;sy=e.clientY;applyTransform()});svg.addEventListener('pointerup',()=>dragging=false);svg.addEventListener('pointercancel',()=>dragging=false);
window.closePanel=closePanel;draw();
</script>
